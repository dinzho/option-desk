# Netlify 配置
# HTML 唔使再 build —— GitHub Actions 已经烤好数据放入 public/
# Netlify 只负责托管，所以 build command 留空，部署近乎即时。
[build]
  publish = "public"
  command = ""
  # 伺服器端代理：令瀏覽器可以讀 Nasdaq API（繞過 CORS + 公共代理失效）
  functions = "netlify/functions"

# 单页应用无路由需求，唔使 redirect rule
[build.processing]
  skip_processing = true

# 手机浏览器成日 cache 住旧版，扫描页必须每次攞最新
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
